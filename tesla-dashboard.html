        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 12px;
            border: 1px solid #333;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .tesla-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        h1 {
            font-size: 2.5em;
            color: #fff;
            margin: 0;
            font-weight: 700;
        }

        .last-updated {
            color: #888;
            font-size: 0.9em;
        }

        .stock-price {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .stock-header {
            margin-bottom: 20px;
        }

        .stock-header h2 {
            color: #fff;
            margin: 0;
            font-size: 1.8em;
        }

        .tradingview-widget-container {
            border-radius: 8px;
            overflow: hidden;
        }

        .weekly-summary {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .weekly-summary h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .change-card {
            background: #252525;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #666;
        }

        .change-card.positive {
            border-left-color: #10b981;
            background: #1a2e23;
        }

        .change-card.negative {
            border-left-color: #ef4444;
            background: #2e1a1a;
        }

        .change-card.neutral {
            border-left-color: #f59e0b;
            background: #2e2a1a;
        }

        .change-card h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .change-card .category {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .change-card p {
            color: #ccc;
            font-size: 0.95em;
        }

        .change-card a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.85em;
        }

        .change-card a:hover {
            text-decoration: underline;
        }

        .trends {
            margin-top: 20px;
            padding: 20px;
            background: #252525;
            border-radius: 8px;
        }

        .trends h3 {
            color: #fff;
            margin-bottom: 12px;
        }

        .trends ul {
            list-style: none;
            padding-left: 0;
        }

        .trends li {
            padding: 8px 0;
            color: #ccc;
            padding-left: 20px;
            position: relative;
        }

        .trends li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #3b82f6;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1400px) {
            .charts-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .chart-card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .chart-card h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: #252525;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #333;
            color: #ccc;
            transition: all 0.3s;
        }

        .tab:hover {
            border-color: #3b82f6;
            color: #fff;
        }

        .tab.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }

        .tab-content {
            display: none;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .critical-news {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
        }

        .critical-news strong {
            color: #3b82f6;
        }

        .key-points {
            margin: 20px 0;
        }

        .key-points ul {
            list-style: none;
            padding-left: 0;
        }

        .key-points li {
            padding: 10px 0 10px 25px;
            position: relative;
            color: #ccc;
            border-bottom: 1px solid #2a2a2a;
        }

        .key-points li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #3b82f6;
            font-size: 1.5em;
            line-height: 1;
        }

        .timeline {
            margin-top: 20px;
        }

        .timeline-item {
            padding: 12px 0 12px 25px;
            position: relative;
            border-left: 2px solid #333;
            margin-left: 10px;
            color: #ccc;
        }

        .timeline-item:before {
            content: "";
            position: absolute;
            left: -6px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
        }

        .timeline-item strong {
            color: #fff;
        }

        .pd-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85em;
        }

        .pd-table th {
            background: #252525;
            color: #fff;
            padding: 12px 8px;
            text-align: right;
            border: 1px solid #333;
            position: sticky;
            top: 0;
            font-weight: 600;
        }

        .pd-table th:first-child {
            text-align: left;
        }

        .pd-table td {
            padding: 10px 8px;
            text-align: right;
            border: 1px solid #2a2a2a;
            color: #ccc;
        }

        .pd-table td:first-child {
            text-align: left;
            font-weight: 600;
            color: #fff;
        }

        .pd-table tr:hover {
            background: #252525;
        }

        .pd-table .positive {
            color: #10b981;
        }

        .pd-table .negative {
            color: #ef4444;
        }

        .pd-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                width: 100%;
            }

            .pd-charts {
                grid-template-columns: 1fr;
            }
        }
    </style>

        function renderProductionDelivery() {
            const pd = data.categories.productionDelivery;
            const container = document.getElementById('productionDelivery');

            let html = `
                <h2>${pd.title}</h2>
                <div style="color: #888; margin-bottom: 15px;">Last Updated: ${pd.latestUpdate}</div>
                <div class="critical-news">
                    <strong>Latest:</strong> ${pd.criticalNews}
                </div>

                <div class="key-points" style="margin-bottom: 30px;">
                    <h3 style="color: #fff; margin-bottom: 15px; margin-top: 20px;">All-Time Totals</h3>
                    <ul>
                        <li><strong>Total Production:</strong> ${parseInt(pd.totalProduction).toLocaleString()} vehicles</li>
                        <li><strong>Total Deliveries:</strong> ${parseInt(pd.totalDeliveries).toLocaleString()} vehicles</li>
                    </ul>
                </div>

                <div class="pd-charts">
                    <div class="chart-card">
                        <h3>Quarterly Production & Delivery</h3>
                        <canvas id="pdQuarterlyChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Annual Delivery Growth</h3>
                        <canvas id="pdAnnualChart"></canvas>
                    </div>
                </div>

                <div class="table-container">
                    <h3 style="color: #fff; margin-bottom: 15px;">Quarterly Data</h3>
                    <table class="pd-table">
                        <thead>
                            <tr>
                                <th>Quarter</th>
                                <th>Production</th>
                                <th>Delivery</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            pd.quarterlyData.forEach(row => {
                html += `
                    <tr>
                        <td>${row.quarter}</td>
                        <td>${row.production ? parseInt(row.production).toLocaleString() : '-'}</td>
                        <td>${row.delivery ? parseInt(row.delivery).toLocaleString() : '-'}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>

                <div class="key-points" style="margin-top: 30px;">
                    <h3 style="color: #fff; margin-bottom: 15px;">Annual Summary</h3>
                    <table class="pd-table">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Deliveries</th>
                                <th>YoY Growth</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            pd.annualSummary.forEach(row => {
                const growthClass = row.yoyGrowth > 0 ? 'positive' : (row.yoyGrowth < 0 ? 'negative' : '');
                const growthDisplay = row.yoyGrowth !== null ?
                    `<span class="${growthClass}">${row.yoyGrowth > 0 ? '+' : ''}${row.yoyGrowth.toFixed(2)}%</span>` :
                    '-';
                html += `
                    <tr>
                        <td>${row.year}</td>
                        <td>${parseInt(row.deliveries).toLocaleString()}</td>
                        <td>${growthDisplay}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

            // Render charts after DOM is updated
            setTimeout(() => {
                renderPDQuarterlyChart();
                renderPDAnnualChart();
            }, 100);
        }

        function renderPDQuarterlyChart() {
            const ctx = document.getElementById('pdQuarterlyChart');
            if (!ctx) return;

            const pd = data.categories.productionDelivery.quarterlyData;
            const labels = pd.map(d => d.quarter);
            const production = pd.map(d => d.production || 0);
            const delivery = pd.map(d => d.delivery || 0);

            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Production',
                            data: production,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Delivery',
                            data: delivery,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#e0e0e0',
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: '#333' }
                        },
                        x: {
                            ticks: {
                                color: '#e0e0e0',
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function renderPDAnnualChart() {
            const ctx = document.getElementById('pdAnnualChart');
            if (!ctx) return;

            const annual = data.categories.productionDelivery.annualSummary;
            const labels = annual.map(d => d.year);
            const deliveries = annual.map(d => d.deliveries);
            const growth = annual.map(d => d.yoyGrowth || 0);

            new Chart(ctx.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Deliveries',
                            data: deliveries,
                            backgroundColor: '#10b981',
                            borderColor: '#10b981',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            label: 'YoY Growth %',
                            data: growth,
                            type: 'line',
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y1',
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.label === 'Deliveries') {
                                        return context.dataset.label + ': ' + context.parsed.y.toLocaleString();
                                    } else {
                                        return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '%';
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            position: 'left',
                            beginAtZero: true,
                            ticks: {
                                color: '#e0e0e0',
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: '#333' }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            ticks: {
                                color: '#e0e0e0',
                                callback: function(value) {
                                    return value.toFixed(0) + '%';
                                }
                            },
                            grid: { display: false }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function loadData() {
            initializeDashboard();
            initTradingViewWidget();
        }

        function initTradingViewWidget() {
            new TradingView.widget({
                "width": "100%",
                "height": 400,
                "symbol": "NASDAQ:TSLA",
                "interval": "D",
                "timezone": "America/New_York",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#1a1a1a",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": false,
                "container_id": "tradingview_widget",
                "backgroundColor": "#1a1a1a",
                "gridColor": "#2a2a2a",
                "studies": [
                    "Volume@tv-basicstudies"
                ]
            });
        }

        function initializeDashboard() {
            // Set last updated
            document.getElementById('lastUpdated').textContent = data.lastUpdated;

            // Render weekly summary
            renderWeeklySummary();

            // Render charts
            renderCybercabChart();
            renderRobotaxiFleetChart();
            renderJobPostingsChart();

            // Render category content
            renderCategoryContent('aiChip', data.categories.aiChip);
            renderCategoryContent('cybercab', data.categories.cybercab);
            renderCategoryContent('fsd', data.categories.fsd);
            renderCategoryContent('jobPostings', data.categories.jobPostings);
            renderCategoryContent('optimus', data.categories.optimus);

            // Render Production & Delivery
            renderProductionDelivery();
        }

        function renderWeeklySummary() {
            const latestWeek = data.weeklySummaries[0];
            const container = document.getElementById('weeklySummaryContent');

            let html = `<h3>Week of ${latestWeek.weekOf}</h3>`;

            latestWeek.keyChanges.forEach(change => {
                html += `
                    <div class="change-card ${change.status}">
                        <div class="category">${change.category}</div>
                        <h3>${change.title}</h3>
                        <p>${change.description}</p>
                        ${change.source ? `<a href="${change.source}" target="_blank">View Source →</a>` : ''}
                    </div>
                `;
            });

            if (latestWeek.trends) {
                html += `
                    <div class="trends">
                        <h3>Trends to Watch</h3>
                        <ul>
                            ${latestWeek.trends.map(trend => `<li>${trend}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderCybercabChart() {
            const ctx = document.getElementById('cybercabChart').getContext('2d');
            const chartData = data.metrics.cybercab.data;

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [{
                        label: 'Unit Count',
                        data: chartData.map(d => d.count),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    return chartData[context.dataIndex].note;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function renderJobPostingsChart() {
            const ctx = document.getElementById('jobPostingsChart').getContext('2d');
            const chartData = data.metrics.jobPostings.data;

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [{
                        label: 'Job Count',
                        data: chartData.map(d => d.count),
                        backgroundColor: '#3b82f6',
                        borderColor: '#3b82f6',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    return chartData[context.dataIndex].note;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function renderRobotaxiFleetChart() {
            const ctx = document.getElementById('robotaxiFleetChart').getContext('2d');
            const chartData = data.metrics.robotaxiFleet.data;

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [{
                        label: 'Active Vehicles',
                        data: chartData.map(d => d.count),
                        backgroundColor: 'rgba(34, 197, 94, 0.2)',
                        borderColor: '#22c55e',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    return chartData[context.dataIndex].note;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#e0e0e0',
                                stepSize: 5
                            },
                            grid: { color: '#333' }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function renderCategoryContent(id, category) {
            const container = document.getElementById(id);

            let html = `
                <h2>${category.title}</h2>
                <div style="color: #888; margin-bottom: 15px;">Last Updated: ${category.latestUpdate}</div>
                <div class="critical-news">
                    <strong>Latest:</strong> ${category.criticalNews}
                </div>
            `;

            if (category.keyPoints) {
                html += `
                    <div class="key-points">
                        <h3 style="color: #fff; margin-bottom: 15px;">Key Points</h3>
                        <ul>
                            ${category.keyPoints.map(point => `<li>${point}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (category.timeline) {
                html += `
                    <div class="timeline">
                        <h3 style="color: #fff; margin-bottom: 15px; margin-top: 25px;">Timeline</h3>
                        ${category.timeline.map(item => `
                            <div class="timeline-item">
                                <strong>${item.date}:</strong> ${item.event}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (category.activeCountries) {
                html += `
                    <div class="key-points">
                        <h3 style="color: #fff; margin-bottom: 15px; margin-top: 25px;">Active Countries</h3>
                        <ul>
                            ${category.activeCountries.map(country => `<li>${country}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (category.pendingCountries) {
                html += `
                    <div class="key-points">
                        <h3 style="color: #fff; margin-bottom: 15px; margin-top: 25px;">Pending/In Progress</h3>
                        <ul>
                            ${category.pendingCountries.map(country => `<li>${country}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (category.roleTypes) {
                html += `
                    <div class="key-points">
                        <h3 style="color: #fff; margin-bottom: 15px; margin-top: 25px;">Role Types</h3>
                        <ul>
                            ${category.roleTypes.map(role => `<li>${role}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (category.pricing) {
                html += `
                    <div class="key-points">
                        <h3 style="color: #fff; margin-bottom: 15px; margin-top: 25px;">Pricing</h3>
                        <ul>
                            <li><strong>Target Price:</strong> ${category.pricing.target}</li>
                            <li><strong>Current Manufacturing Cost:</strong> ${category.pricing.currentCost}</li>
                            <li><strong>Initial Commercial Price:</strong> ${category.pricing.initialCommercial}</li>
                        </ul>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function showTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Load data on page load
        loadData();
    </script>
</body>
