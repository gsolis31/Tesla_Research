name: Tesla Tracker Auto-Update

on:
  # Automated scheduling disabled - web search not available in Claude API
  # Use manual /tesla-update via Claude Code CLI instead

  # schedule:
  #   - cron: '0 15 * * 1'

  # Allow manual trigger from GitHub Actions tab (for testing only)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4

      - name: Run Tesla Update Script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_update.py

      - name: Commit and push changes
        run: |
          git config user.name "Tesla Tracker Bot"
          git config user.email "tesla-bot@github-actions"
          git add tesla-tracking-data.json index.html
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')

          Weekly automated update via GitHub Actions

          Co-Authored-By: Tesla Tracker Bot <tesla-bot@github-actions>"
          git push || echo "No changes to push"
